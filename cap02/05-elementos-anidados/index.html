<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Heladería</title>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import React from "https://esm.sh/react@19.2.0?dev";
        import { createRoot } from "https://esm.sh/react-dom@19.2.0/client?dev";

        // 1. De dentro hacia afuera: primero los hijos más profundos (<h2> y <p>)
        const itemName = React.createElement("h2", null, "Mora silvestre");
        const itemDescription = React.createElement(
            "p",
            { className: "menu-item-description" },
            "Mora de Ambato con un toque de limón."
        );

        // 2. Luego el padre directo (<article>) recibiendo a sus hijos como 3.er y 4.to argumento
        const menuItem = React.createElement(
            "article",
            { className: "menu-item" },
            itemName,
            itemDescription
        );

        // 3. El encabezado principal (<h1>) y el contenedor raíz (<main>) que envuelve todo
        const heading = React.createElement("h1", null, "La Heladería");
        const menu = React.createElement("main", null, heading, menuItem);

        // 4. Montaje en el DOM real
        createRoot(document.getElementById("root")).render(menu);

        // 5. Comprobación interna: los hijos viven dentro de props.children (pág. 45-46)
        console.log(menuItem.props);
    </script>
</body>
</html>
