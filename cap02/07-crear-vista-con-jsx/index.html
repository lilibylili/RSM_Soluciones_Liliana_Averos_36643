<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Heladería</title>
</head>

<body>
    <div id="root"></div>

    <!-- 1. Babel Standalone para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>

    <!-- 2. Bloque marcado para Babel con soporte de módulos ES -->
    <script type="text/babel" data-type="module">
        import React from "https://esm.sh/react@19.2.0?dev";
        import {createRoot} from "https://esm.sh/react-dom@19.2.0/client?dev";

        // Vista completa en JSX de fuera hacia adentro.
        // El fragmento <> ... </> agrupa <main> y <footer> sin añadir un <div> extra al DOM.
        const menu = (
            <>
                <main>
                    <h1>La Heladería</h1>
                    <article className="menu-item">
                        <h2>Mora silvestre</h2>
                        <p className="menu-item-description">
                            Mora de Ambato con un toque de limón.
                        </p>
                    </article>
                    
                    {/* Actividad practica en clase: añadir el segundo article dentro del main */}
                    <article className="menu-item">
                        <h2>Guanábana</h2>
                        <p className="menu-item-description">
                            Guanábana cremosa con chips de chocolate.
                        </p>
                    </article>
                </main>
                <footer>
                    <p>La Heladería — Ambato</p>
                </footer>
            </>
        );

        createRoot(document.getElementById("root")).render(menu);
    </script>
</body>

</html>
