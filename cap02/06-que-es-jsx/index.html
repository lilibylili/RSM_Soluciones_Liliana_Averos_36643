<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Heladería</title>
</head>
<body>
    <div id="root"></div>

    <!-- 1. Babel Standalone desde CDN para traducir JSX a JavaScript -->
    <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>

    <!-- 2. Bloque marcado para Babel con data-type="module" para mantener los imports -->
    <script type="text/babel" data-type="module">
        import React from "https://esm.sh/react@19.2.0?dev";
        import { createRoot } from "https://esm.sh/react-dom@19.2.0/client?dev";

        // Elementos anidados con createElement (se quedan igual que en 02-05)
        const itemName = React.createElement("h2", null, "Mora silvestre");
        const itemDescription = React.createElement(
            "p",
            { className: "menu-item-description" },
            "Mora de Ambato con un toque de limón."
        );
        const menuItem = React.createElement(
            "article",
            { className: "menu-item" },
            itemName,
            itemDescription
        );

        // Encabezado escrito en JSX (convive con createElement en el mismo archivo)
        const heading = <h1>La Heladería</h1>;
        console.log(heading);

        const menu = React.createElement("main", null, heading, menuItem);

        createRoot(document.getElementById("root")).render(menu);
    </script>
</body>
</html>
