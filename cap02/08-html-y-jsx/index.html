<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Heladería</title>
</head>
<body>
    <!-- 1. Campo escrito a mano en HTML estándar (antes del contenedor de React) -->
    <label for="name-html">Nombre del sabor</label>
    <input id="name-html" maxlength="40" readonly class="field" />

    <!-- 2. Contenedor donde React montará la versión en JSX -->
    <div id="root"></div>

    <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>
    <script type="text/babel" data-type="module">
        import React from "https://esm.sh/react@19.2.0?dev";
        import { createRoot } from "https://esm.sh/react-dom@19.2.0/client?dev";

        // 3. Mismo campo escrito en JSX aplicando las tres reglas:
        // - Palabras reservadas cambian: for -> htmlFor, class -> className
        // - Atributos compuestos en camelCase: maxlength -> maxLength, readonly -> readOnly
        // - Etiquetas vacías autocerradas: <input ... />
        const field = (
            <>
                <label htmlFor="name-jsx">Nombre del sabor</label>
                <input
                    id="name-jsx"
                    maxLength="40"
                    readOnly
                    className="field"
                />
            </>
        );

        createRoot(document.getElementById("root")).render(field);
    </script>
</body>
</html>
