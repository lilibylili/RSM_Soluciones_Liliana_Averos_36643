<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Funciones puras - La Heladería</title>
</head>
<body>
    <h1>Funciones puras (abre la consola del navegador)</h1>

    <script>
        // Datos base del modelo de La Heladería
        const menuItem = {
            id: 1,
            iceCream: {
                id: 3,
                name: "Mora silvestre",
                imagePath: "images/mora.svg",
            },
            price: 1.5,
            description: "Mora de Ambato con un toque de limón.",
            inStock: true,
        };

        // 1. FUNCIÓN PURA: mismo argumento -> siempre el mismo resultado
        const formatPrice = (price) =>
            new Intl.NumberFormat("es-EC", {
                style: "currency",
                currency: "USD",
            }).format(price);

        console.log("--- 1. Función pura (formatPrice) ---");
        console.log(formatPrice(1.5)); // $1,50
        console.log(formatPrice(1.5)); // $1,50

        // 2. FUGA 1: MIRAR AFUERA -> depende de una variable externa
        let taxRate = 0.12;
        const priceWithTax = (price) => price * (1 + taxRate);

        console.log("--- 2. Fuga 1: Mirar afuera (priceWithTax) ---");
        console.log(formatPrice(priceWithTax(1.5))); // $1,68
        taxRate = 0.15;
        console.log(formatPrice(priceWithTax(1.5))); // $1,72

        // 3. FUGA 2: TOCAR LO QUE TE DIERON -> muta el objeto original
        const applyDiscount = (item, percent) => {
            item.price = item.price * (1 - percent);
            return item;
        };

        console.log("--- 3. Fuga 2: Mutar el objeto original (applyDiscount) ---");
        console.log(formatPrice(menuItem.price)); // $1,50
        const enOferta = applyDiscount(menuItem, 0.2);
        console.log(formatPrice(enOferta.price)); // $1,20
        console.log(formatPrice(menuItem.price)); // $1,20

        // 4. DEVOLVER EN VEZ DE MODIFICAR -> crea un objeto nuevo con spread (...)
        const withDiscount = (item, percent) => ({
            ...item,
            price: item.price * (1 - percent),
        });

        console.log("--- 4. Copia superficial con spread (withDiscount) ---");
        const rebajado = withDiscount(menuItem, 0.2);
        console.log(formatPrice(rebajado.price)); // $0,96
        console.log(formatPrice(menuItem.price)); // $1,20

        console.log(rebajado === menuItem); // false
        console.log(rebajado.iceCream === menuItem.iceCream); // true

        // 5. PRÁCTICA EN CLASE · ACTIVIDAD 13: push frente a spread en un array
        const menu = [menuItem];

        // Versión impura: muta el array original con push
        const addItemPush = (menu, item) => {
            menu.push(item);
            return menu;
        };

        // Versión pura: devuelve una copia nueva con [...menu, item] sin tocar el original
        const addItem = (menu, item) => [...menu, item];

        console.log("--- 5. Actividad 13: push frente a spread ---");

        // Primero llamamos a la versión pura (spread)
        addItem(menu, rebajado);
        console.log(menu.length); // 1 (queda igual, el array original no fue mutado)

        // Luego llamamos a la versión impura (push)
        addItemPush(menu, rebajado);
        console.log(menu.length); // 2 (crece, el array original fue mutado)

        /*
         * PREGUNTA (Actividad 13):
         * Si addItem muta el menú de la aplicación, ¿quién más se entera del cambio?
         *
         * RESPUESTA:
         * Nadie y menos React. Como el array sigue siendo el mismo en memoria,
         * React no detecta ningún cambio y no vuelve a renderizar la pantalla;
         * además, cualquier otro componente que use ese array ve sus datos
         * alterados sin aviso.
         */
    </script>
</body>
</html>
